name: Enterprise Reactive Cloud Pipeline CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out application source code from repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Configure JDK 21 build environment with Maven dependency caching
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Step 3: Compile source code and execute automated unit tests
      - name: Compile and Test
        run: mvn clean test -B

      # Step 4: Authenticate with container registry using encrypted repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 5: Build and push multi-stage Docker image tagged with Git commit SHA
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/order-service:${{ github.sha }}

      # Step 6: Authenticate with target Kubernetes cluster using Kubeconfig secret
      - name: Set up Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      # Step 7: Perform zero-downtime rolling update deployment on Kubernetes
      - name: Deploy to Kubernetes Cluster
        run: |
          kubectl set image deployment/order-service-deployment order-service=${{ secrets.DOCKER_USERNAME }}/order-service:${{ github.sha }}
          kubectl rollout status deployment/order-service-deployment